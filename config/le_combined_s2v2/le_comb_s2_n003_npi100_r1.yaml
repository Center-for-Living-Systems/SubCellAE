# =============================================================================
# Combined efficiency s2v2 — N_images=3  npi=100  series=1
# AE trains on 3 frame(s): [0, 1, 4]
# LGBM labels: 185 total (100 per frame × 2 frames, cumulative series 1)
# Test: frames 2, 3  (always held out)
# =============================================================================

data:
  patch_dirs:
    - path           : "/net/projects/CLS/lding/data/fa_data_analysis/ae_results/patches/cio/vinc/control/tiff_patches32_mr10"
      frame_dir      : "/net/projects/CLS/lding/data/fa_data_analysis/ae_results/source_frames/cio_mode_prt/vinc/control"
      include_frames : [0, 1, 4]
      condition      : 0
      condition_name : "control"

enlarged_crop:
  enabled       : true
  channel       : "pax"
  context_size  : 58
  max_shift_px  : 4
  max_angle_deg : 15.0
  pad_size      : 64
  input_divisor : 2.0

output:
  result_dir : "/net/projects/CLS/lding/data/fa_data_analysis/ae_results/contrastive_run/le_combined_s2v2/le_comb_s2_n003_npi100_r1"

model:
  model_type      : "supcon"
  latent_dim      : 12
  input_ps        : 32
  no_ch           : 1
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : false
  recon_loss_type : "nl1"

  proj_dim              : 8
  noise_prob            : 0.0
  temperature           : 0.5
  lambda_recon          : 1.0
  lambda_contrast       : 0.5
  intensity_scale_range : [0.8, 1.2]

annotation:
  annotation_file : "/net/projects/CLS/lding/data/fa_data_analysis/labelling/le_combined_s2v2/le_comb_s2_npi100_r1.csv"
  label_col       : "label"
  filename_col    : "unique_ID"
  label_order:
    - "No adhesion"
    - "adhesion"

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 6
  val_split               : 0.0
  group_split             : false
  loss_norm_flag          : false
  weight_decay            : 0.0001
  warmup_epochs           : 0
  lr_scheduler            : "none"
  early_stopping_patience : 0
  min_epochs_for_best     : 501

reconstruction:
  save_recon : false

misc:
  device    : "auto"
  log_level : "INFO"
