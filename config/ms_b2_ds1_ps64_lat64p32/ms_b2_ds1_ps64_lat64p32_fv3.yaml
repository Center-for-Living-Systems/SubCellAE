# =============================================================================
# Multiscale B2 DS1 ps64 — fv3 — test fold 3
# AE trained on DS1 B2 (Annabel, ctrl+ycomp) with patch_size=64.
# Patches cropped online from source frames via CoordCropDataset.
# =============================================================================
root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  coord_dirs:
    - coord_csv      : root_folder + "/labelling/ms_b2_ds1_ps64_lat64p32/ms_b2_ds1_ps64_lat64p32_fv3_train.csv"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_mode_prt/vinc/control"
      channel        : "pax"
      condition      : 0
      condition_name : "control"
      annotation_label_col : "label"
      label_order    :
        - "No adhesion"
        - "adhesion"

    - coord_csv      : root_folder + "/labelling/ms_b2_ds1_ps64_lat64p32/ms_b2_ds1_ps64_lat64p32_fv3_train.csv"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_mode_prt/vinc/ycomp"
      channel        : "pax"
      condition      : 1
      condition_name : "ycomp"
      annotation_label_col : "label"
      label_order    :
        - "No adhesion"
        - "adhesion"

  patch_dirs: []

output:
  result_dir : root_folder + "/ae_results/multiscale/ms_b2_ds1_ps64_lat64p32/ms_b2_ds1_ps64_lat64p32_fv3"

model:
  model_type      : "supcon"
  latent_dim      : 64
  input_ps        : 64
  no_ch           : 1
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : false
  recon_loss_type : "nl1"

  proj_dim              : 32
  noise_prob            : 0.0
  temperature           : 0.5
  lambda_recon          : 1.0
  lambda_contrast       : 0.5
  lambda_supcon         : 5.0
  intensity_scale_range : [0.8, 1.2]

annotation:
  annotation_file : ""
  label_col       : "label"
  label_order:
    - "No adhesion"
    - "adhesion"

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 0
  val_split               : 0.2
  loss_norm_flag          : false
  group_split             : true
  weight_decay            : 0.0001
  warmup_epochs           : 0
  lr_scheduler            : "none"
  early_stopping_patience : 0
  min_epochs_for_best     : 0

reconstruction:
  save_recon       : false
  recon_pad_size   : 80
  recon_image_size : 1024

misc:
  device    : "auto"
  log_level : "INFO"
