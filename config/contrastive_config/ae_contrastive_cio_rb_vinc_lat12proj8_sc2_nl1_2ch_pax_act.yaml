# =============================================================================
# AE variant: contrastive (NT-Xent ConAE) — 2-channel input: paxillin (ch1) + actin (ch3)
# MultiChannelPatchDataset stacks ch1/ch3 patches; no enlarged crop (not supported for 2ch)
# latent_dim=12, proj_dim=8; sc2 input_divisor=2.0; nl1 loss; lambda_contrast=0.5
# Results: ae_results/contrastive_run/contrastive_cio_rb_vinc_lat12proj8_sc2_nl1_2ch_pax_act/
# =============================================================================
root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  patch_dirs:
    - channel_dirs:
        - root_folder + "/ae_results/patches/cio_rb/vinc/control/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio_rb/vinc_ch3/control/tiff_patches32_mr10"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_rb/vinc/control"
      condition      : 0
      condition_name : "control"
    - channel_dirs:
        - root_folder + "/ae_results/patches/cio_rb/vinc/ycomp/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio_rb/vinc_ch3/ycomp/tiff_patches32_mr10"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_rb/vinc/ycomp"
      condition      : 1
      condition_name : "ycomp"

enlarged_crop:
  enabled       : true
  channel       : ["pax", "act"]
  context_size  : 58
  max_shift_px  : 4
  max_angle_deg : 15.0
  pad_size      : 64
  input_divisor : 2.0

output:
  result_dir : root_folder + "/ae_results/contrastive_run/contrastive_cio_rb_vinc_lat12proj8_sc2_nl1_2ch_pax_act"

model:
  model_type      : "contrastive"
  latent_dim      : 12
  input_ps        : 32
  no_ch           : 2
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : true
  recon_loss_type : "nl1"

  proj_dim              : 8
  noise_prob            : 0.05
  temperature           : 0.5
  lambda_recon          : 1.0
  lambda_contrast       : 0.5
  intensity_scale_range : [0.8, 1.2]

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 6
  val_split               : 0.2
  loss_norm_flag          : false
  group_split             : true
  weight_decay            : 0.0001
  warmup_epochs           : 0
  lr_scheduler            : "cosine"
  early_stopping_patience : 0
  min_epochs_for_best     : 0

reconstruction:
  save_recon      : true
  recon_pad_size  : 64
  recon_image_size: 1024

misc:
  device    : "auto"
  log_level : "INFO"
