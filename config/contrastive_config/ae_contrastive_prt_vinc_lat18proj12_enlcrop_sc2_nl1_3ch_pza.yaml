# =============================================================================
# AE variant: contrastive (NT-Xent ConAE) — 3ch pax+zyx+act
# Normalization: CIO (no RB)  |  Dataset: vinc (ds1) control + ycomp
# latent_dim=18, proj_dim=12, no_ch=3
# Enlarged crop: 58×58; ±4px + ±15° on GPU; sc2: input /2
# normalized L1; lambda_contrast=0.5
# Results: ae_results/contrastive_run/contrastive_prt_vinc_lat18proj12_enlcrop_sc2_nl1_3ch_pza/
# =============================================================================
root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  patch_dirs:
    - channel_dirs:
        - root_folder + "/ae_results/patches/cio/vinc/control/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio/vinc/control/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio/vinc/control/tiff_patches32_mr10"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_mode_prt/vinc/control"
      condition      : 0
      condition_name : "control"
    - channel_dirs:
        - root_folder + "/ae_results/patches/cio/vinc/ycomp/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio/vinc/ycomp/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio/vinc/ycomp/tiff_patches32_mr10"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_mode_prt/vinc/ycomp"
      condition      : 1
      condition_name : "ycomp"

enlarged_crop:
  enabled       : true
  channel       : ["pax", "zyx", "act"]
  context_size  : 58
  max_shift_px  : 4
  max_angle_deg : 15.0
  pad_size      : 64
  input_divisor : 2.0

output:
  result_dir : root_folder + "/ae_results/contrastive_run/contrastive_prt_vinc_lat18proj12_enlcrop_sc2_nl1_3ch_pza"

model:
  model_type      : "contrastive"
  latent_dim      : 18
  input_ps        : 32
  no_ch           : 3
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : false
  recon_loss_type : "nl1"

  proj_dim              : 12
  noise_prob            : 0.05
  temperature           : 0.5
  lambda_recon          : 1.0
  lambda_contrast       : 0.5
  intensity_scale_range : [0.8, 1.2]

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 6
  val_split               : 0.2
  loss_norm_flag          : false
  group_split             : true
  weight_decay            : 0.0001
  warmup_epochs           : 0
  lr_scheduler            : "cosine"
  early_stopping_patience : 0
  min_epochs_for_best     : 0

reconstruction:
  save_recon      : true
  recon_pad_size  : 64
  recon_image_size: 1024

misc:
  device    : "auto"
  log_level : "INFO"
