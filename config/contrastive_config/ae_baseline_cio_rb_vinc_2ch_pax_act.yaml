# =============================================================================
# AE variant: baseline (standard AE) — 2-channel input: paxillin (ch1) + actin (ch3)
# Patches stacked from separate ch1/ch3 dirs via MultiChannelPatchDataset
# latent_dim=12, no_ch=2
# Results: ae_results/contrastive_run/baseline_vinc_2ch_pax_act/
# =============================================================================
root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  patch_dirs:
    - channel_dirs:
        - root_folder + "/ae_results/patches/cio_rb/vinc/control/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio_rb/vinc_ch3/control/tiff_patches32_mr10"
      condition      : 0
      condition_name : "control"
    - channel_dirs:
        - root_folder + "/ae_results/patches/cio_rb/vinc/ycomp/tiff_patches32_mr10"
        - root_folder + "/ae_results/patches/cio_rb/vinc_ch3/ycomp/tiff_patches32_mr10"
      condition      : 1
      condition_name : "ycomp"

output:
  result_dir : root_folder + "/ae_results/contrastive_run/baseline_vinc_2ch_pax_act"

model:
  model_type      : "ae"
  latent_dim      : 12
  input_ps        : 32
  no_ch           : 2
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : true

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 6
  val_split               : 0.2
  loss_norm_flag          : false
  group_split             : true
  weight_decay            : 0.0001
  lr_scheduler            : "cosine"
  early_stopping_patience : 0
  min_epochs_for_best     : 0

reconstruction:
  save_recon      : true
  recon_pad_size  : 64
  recon_image_size: 1024

misc:
  device    : "auto"
  log_level : "INFO"
