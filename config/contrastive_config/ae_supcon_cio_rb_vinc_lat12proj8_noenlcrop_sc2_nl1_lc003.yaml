# =============================================================================
# AE variant: supervised contrastive (SupCon AE)
# Normalization: CIO-RB  |  Dataset: vinc control + ycomp
# latent_dim=12, proj_dim=8
# No enlarged crop — loads pre-extracted tiff_patches32_mr10 directly
# sc2: patch_input_divisor=2.0; normalized L1; lambda_contrast=0.03
# Same patch coordinates as the enlcrop_shift0_rot0 comparison run
# Results: ae_results/contrastive_run/supcon_cio_rb_vinc_lat12proj8_noenlcrop_sc2_nl1_lc003/
# =============================================================================
root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  patch_dirs:
    - path           : root_folder + "/ae_results/patches/cio_rb/vinc/control/tiff_patches32_mr10"
      condition      : 0
      condition_name : "control"
    - path           : root_folder + "/ae_results/patches/cio_rb/vinc/ycomp/tiff_patches32_mr10"
      condition      : 1
      condition_name : "ycomp"

output:
  result_dir : root_folder + "/ae_results/contrastive_run/supcon_cio_rb_vinc_lat12proj8_noenlcrop_sc2_nl1_lc003"

model:
  model_type      : "supcon"
  latent_dim      : 12
  input_ps        : 32
  no_ch           : 1
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : true
  recon_loss_type : "nl1"

  proj_dim              : 8
  noise_prob            : 0.05
  temperature           : 0.5
  lambda_recon          : 1.0
  lambda_contrast       : 0.03
  intensity_scale_range : [0.8, 1.2]

annotation:
  annotation_file : root_folder + "/labelling/labels_vinc_20260521.csv"
  label_col       : "classification"
  filename_col    : "unique_ID"
  label_order:
    - "Nascent Adhesion"
    - "focal complex"
    - "focal adhesion"
    - "fibrillar adhesion"
    - "No adhesion"

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 6
  val_split               : 0.2
  loss_norm_flag          : false
  group_split             : true
  weight_decay            : 0.0001
  warmup_epochs           : 0
  lr_scheduler            : "cosine"
  early_stopping_patience : 0
  min_epochs_for_best     : 0
  patch_input_divisor     : 2.0

reconstruction:
  save_recon      : true
  recon_pad_size  : 64
  recon_image_size: 1024

misc:
  device    : "auto"
  log_level : "INFO"
