# contrastive | enlcrop | MSE | shift0 rot0 | nosc2 | nosig | warmup100
# Results: ae_results/contrastive_run/contrastive_cio_rb_vinc_lat12proj8_enlcrop_mse_shift0_rot0_nosig_warmup100/
# AE variant: contrastive  (NT-Xent contrastive AE)
# Normalization: CIO-RB  |  Dataset: vinc control + ycomp
# latent_dim=12, proj_dim=8
# Enlarged crop: 58×58 context; shift=0 + rotation=0 (no spatial aug at all)
# Ablation: isolates whether bilinear resampling during rotation causes smoothing
# sc2: input /2; normalized L1
# Results: ae_results/contrastive_run/contrastive_cio_rb_vinc_lat12proj8_enlcrop_sc2_mse_shift0_rot0/

root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  patch_dirs:
    - path           : root_folder + "/ae_results/patches/cio_rb/vinc/control/tiff_patches32_mr10"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_rb/vinc/control"
      condition      : 0
      condition_name : "control"
    - path           : root_folder + "/ae_results/patches/cio_rb/vinc/ycomp/tiff_patches32_mr10"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_rb/vinc/ycomp"
      condition      : 1
      condition_name : "ycomp"

enlarged_crop:
  enabled       : true
  channel       : "pax"
  context_size  : 58
  max_shift_px  : 0
  max_angle_deg : 0.0
  pad_size      : 64
  input_divisor : 1.0

output:
  result_dir : root_folder + "/ae_results/contrastive_run/contrastive_cio_rb_vinc_lat12proj8_enlcrop_mse_shift0_rot0_nosig_warmup100"

model:
  model_type      : "contrastive"
  latent_dim      : 12
  input_ps        : 32
  no_ch           : 1
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : false
  recon_loss_type : "mse"

  proj_dim              : 8
  noise_prob            : 0.05
  temperature           : 0.5
  lambda_recon          : 1.0
  lambda_contrast       : 0.5
  intensity_scale_range : [0.8, 1.2]

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 6
  val_split               : 0.2
  loss_norm_flag          : false
  group_split             : true
  weight_decay            : 0.0001
  warmup_epochs           : 100
  lr_scheduler            : "cosine"
  early_stopping_patience : 0
  min_epochs_for_best     : 100

reconstruction:
  save_recon      : true
  recon_pad_size  : 64
  recon_image_size: 1024

misc:
  device    : "auto"
  log_level : "INFO"
