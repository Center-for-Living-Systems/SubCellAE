# =============================================================================
# AE variant: baseline (standard AE, no supervision)
# Training data: vinc only (control + ycomp)
# Preprocessing: histogram matching to pooled reference (vinc+ppax+pfak+nih3t3)
# Purpose: test if histogram matching improves generalisation to unseen datasets
# Results: ae_results/generalizability/baseline_vinc_only_histmatch/
# =============================================================================
root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  patch_dirs:
    - path           : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc/control/tiff_patches32"
      condition      : 0
      condition_name : "control"
    - path           : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc/ycomp/tiff_patches32"
      condition      : 1
      condition_name : "ycomp"

output:
  result_dir : root_folder + "/ae_results/generalizability/baseline_vinc_only_histmatch"

model:
  model_type   : "ae"
  latent_dim   : 8
  input_ps     : 32
  no_ch        : 1
  BN_flag      : false
  dropout_flag : false

training:
  epochs                : 500
  lr                    : 0.001
  batch_size            : 128
  val_split             : 0.2
  loss_norm_flag        : false
  group_split           : true
  weight_decay          : 0.0001
  lr_scheduler          : "cosine"
  lr_min                : 1e-5
  min_epochs_for_best   : 200

preprocessing:
  hist_map_dir : root_folder + "/ae_results/histogram_maps"

reconstruction:
  save_recon      : true
  recon_pad_size  : 64
  recon_image_size: 1024

misc:
  device    : "auto"
  log_level : "INFO"
