# =============================================================================
# AE_multiscale template — vinc control+ycomp, patch_size=32
# Switch input_ps to 16/48/64/96/128 to try other scales.
# Patches are cropped on-the-fly from source frames — no pre-saved TIFs needed.
# =============================================================================
root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  coord_dirs:
    - coord_csv      : root_folder + "/labelling/vinc_b1b2_coords.csv"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_mode_prt/vinc/control"
      channel        : "pax"
      condition      : 0
      condition_name : "control"
      annotation_label_col : "label"
      label_order    :
        - "No adhesion"
        - "adhesion"

    - coord_csv      : root_folder + "/labelling/vinc_b1b2_coords.csv"
      frame_dir      : root_folder + "/ae_results/source_frames/cio_mode_prt/vinc/ycomp"
      channel        : "pax"
      condition      : 1
      condition_name : "ycomp"
      annotation_label_col : "label"
      label_order    :
        - "No adhesion"
        - "adhesion"

  patch_dirs: []   # empty — using coord_dirs only

output:
  result_dir : root_folder + "/ae_results/multiscale/vinc_ps32"

model:
  model_type      : "supcon"
  latent_dim      : 12
  input_ps        : 32    # <-- change to 16 / 48 / 64 / 96 / 128
  no_ch           : 1
  BN_flag         : false
  dropout_flag    : false
  output_sigmoid  : false
  recon_loss_type : "nl1"

  proj_dim              : 8
  noise_prob            : 0.0
  temperature           : 0.5
  lambda_recon          : 1.0
  lambda_contrast       : 0.5
  intensity_scale_range : [0.8, 1.2]

annotation:
  annotation_file : ""   # labels come from coord_csv
  label_col       : "label"
  label_order:
    - "No adhesion"
    - "adhesion"

training:
  epochs                  : 500
  lr                      : 0.001
  batch_size              : 128
  num_workers             : 0
  val_split               : 0.25
  loss_norm_flag          : false
  group_split             : true
  weight_decay            : 0.0001
  warmup_epochs           : 0
  lr_scheduler            : "none"
  early_stopping_patience : 0
  min_epochs_for_best     : 0

reconstruction:
  save_recon       : false   # coord-based patches have no pre-saved TIFs to compare against
  recon_pad_size   : 64
  recon_image_size : 1024

misc:
  device    : "auto"
  log_level : "INFO"
