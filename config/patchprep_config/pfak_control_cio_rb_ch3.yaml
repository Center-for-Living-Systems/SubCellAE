# Dataset   : pfak (20250720) — ch3 (actin/phalloidin)
# Condition : control
# major_ch=3 (actin); seg_ch=1 (paxillin) for FA position detection
paths:
  root_folder      : "/net/projects/CLS/lding/data/fa_data_analysis"
  image_folder     : root_folder + "/fa_data/other_paxillin/20250720_eGFP-Zyxin 488, Phalloidin 405, pFAK (rb) 647, paxillin(m)568/072025/Control"
  cell_mask_folder : null
  patch_output_dir : root_folder + "/ae_results/patches/cio_rb/pfak_ch3/control/tiff_patches32_mr10"
  plot_output_dir  : root_folder + "/ae_results/patches/cio_rb/pfak_ch3/control/plot_patches32_mr10"

experiment:
  condition : "control"
  major_ch  : 3

input:
  file_type : "czi"
  start_ind : 0
  end_ind   : 999

patch:
  patch_size   : 32
  mask_ratio   : 0.1
  pad_size     : 64
  patch_prefix : "control"

preprocessing:
  rolling_ball_radius : 20

normalization:
  norm_mode : "cell_insideoutside"

segmentation:
  seg_ch                  : 1
  seg_threshold           : 0.1
  seg_close_size          : 11
  seg_min_size_initial    : 3
  seg_min_size_post_close : 10
  seg_min_size_final      : 30000

augmentation:
  rand_trans    : false
  max_shift_px  : 0
  rand_rota     : false
  max_angle_deg : 0.0

misc:
  dpi           : 256
  debug         : false
  log_level     : "INFO"
  use_timestamp : false
