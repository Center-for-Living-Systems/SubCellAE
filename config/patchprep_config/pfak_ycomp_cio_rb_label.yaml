# Dataset   : pfak (20250720 – pFAK/rb647 + paxillin/m568)
# Condition : ycomp
# Norm      : cell_insideoutside  (rolling ball radius 20)
# Seg       : on-the-fly; seg_threshold=0.08 (lower than training, for broader cell coverage)
# Labelling : mask_ratio=0.1, separate output dirs — do NOT use for AE training
paths:
  root_folder      : "/net/projects/CLS/lding/data/fa_data_analysis"
  image_folder     : root_folder + "/fa_data/other_paxillin/20250720_eGFP-Zyxin 488, Phalloidin 405, pFAK (rb) 647, paxillin(m)568/072025/Ycomp"
  cell_mask_folder : null
  patch_output_dir : root_folder + "/ae_results/patches/cio_rb/pfak/ycomp/tiff_patches32_label"
  plot_output_dir  : root_folder + "/ae_results/patches/cio_rb/pfak/ycomp/plot_patches32_label"

experiment:
  condition : "ycomp"
  major_ch  : 1

input:
  file_type : "czi"
  start_ind : 0
  end_ind   : 999

patch:
  patch_size   : 32
  mask_ratio   : 0.1
  pad_size     : 64
  patch_prefix : "ycomp"

preprocessing:
  rolling_ball_radius : 20

normalization:
  norm_mode : "cell_insideoutside"

segmentation:
  seg_ch                  : 1
  seg_threshold           : 0.08
  seg_close_size          : 11
  seg_min_size_initial    : 3
  seg_min_size_post_close : 10
  seg_min_size_final      : 30000

augmentation:
  rand_trans    : false
  max_shift_px  : 0
  rand_rota     : false
  max_angle_deg : 0.0

misc:
  dpi           : 256
  debug         : false
  log_level     : "INFO"
  use_timestamp : false
