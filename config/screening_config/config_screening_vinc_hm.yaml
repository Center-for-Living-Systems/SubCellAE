# =============================================================================
# Screening sweep with histogram matching normalisation at train time
# Dataset: vinc labeled patches
# Model: sweep via CLI --backbone / --input_size overrides
#
# The training patches are histogram-matched to the vinc reference CDF.
# For training on vinc itself this is a near-identity mapping, but it saves
# the reference CDF to out_dir/ref_cdf_*.npy so inference scripts can apply
# the exact same correction to unseen datasets (e.g. ppax).
# =============================================================================

root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  label_csv     : root_folder + "/labelling/labels_vinc_20260521.csv"
  patch_dirs:
    control : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc/control/tiff_patches32"
    ycomp   : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc/ycomp/tiff_patches32"
  label_col     : "classification"
  filename_col  : "unique_ID"
  condition_col : "condition"
  group_col     : "czi_filename"
  ad_labels:
    - "Nascent Adhesion"
    - "focal complex"
    - "focal adhesion"
    - "fibrillar adhesion"
  nonad_label   : "No adhesion"
  exclude_labels:
    - "Uncertain"

output:
  out_dir : root_folder + "/ae_results/screening/sweep_hm/placeholder"  # overridden by --out_dir

model:
  backbone   : "efficientnet_b0"   # overridden by --backbone
  pretrained : true
  input_size : 224                  # overridden by --input_size
  dropout    : 0.3

training:
  epochs             : 50
  batch_size         : 64
  lr                 : 0.001
  weight_decay       : 0.01
  lr_scheduler       : "cosine"
  patience           : 15
  use_augmentation   : true
  num_workers        : 4
  test_size          : 0.2
  random_state       : 42
  pixel_correction       : "histogram"   # full CDF matching
  correction_max_patches : 5000

misc:
  device    : "auto"
  log_level : "INFO"
