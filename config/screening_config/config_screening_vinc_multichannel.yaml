# =============================================================================
# Screening experiment 2: multi-channel only (no intensity jitter)
# Training: vinc paxillin (ch1) + vinc vinculin (ch0) patches as separate samples
# Both share the same binary labels (adhesion / no-adhesion).
#
# REQUIRES: vinc ch0 patches extracted first.
#   sbatch scripts/sbatch_extract_vinc_ch0.sh
# =============================================================================

root_folder : "/net/projects/CLS/lding/data/fa_data_analysis"

data:
  label_csv     : root_folder + "/labelling/labels_vinc_20260521.csv"
  patch_dirs:
    control : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc/control/tiff_patches32"
    ycomp   : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc/ycomp/tiff_patches32"
  label_col     : "classification"
  filename_col  : "unique_ID"
  condition_col : "condition"
  group_col     : "czi_filename"
  ad_labels:
    - "Nascent Adhesion"
    - "focal complex"
    - "focal adhesion"
    - "fibrillar adhesion"
  nonad_label   : "No adhesion"
  exclude_labels:
    - "Uncertain"

output:
  out_dir : root_folder + "/ae_results/screening/sweep_multichannel/placeholder"

model:
  backbone   : "efficientnet_b0"
  pretrained : true
  input_size : 224
  dropout    : 0.3

training:
  epochs            : 50
  batch_size        : 64
  lr                : 0.001
  weight_decay      : 0.01
  lr_scheduler      : "cosine"
  patience          : 15
  use_augmentation  : true
  num_workers       : 4
  test_size         : 0.2
  random_state      : 42

  use_intensity_jitter : false
  jitter_scale_lo      : 0.5
  jitter_scale_hi      : 2.0
  jitter_shift_std     : 0.05

  # Vinculin (ch0) patches from the same CZI files — same labels apply.
  # Patches at the same spatial coordinates in the vinculin channel.
  extra_patch_dirs:
    - control : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc_ch0/control/tiff_patches32"
      ycomp   : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc_ch0/ycomp/tiff_patches32"

misc:
  device    : "auto"
  log_level : "INFO"
