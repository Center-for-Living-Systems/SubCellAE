# =============================================================================
# Patch-prep: vinc training data — vinculin channel (ch0, rb647)
# Same CZI files as the existing paxillin (ch1) patches.
# Produces cio_rb-normalised single-channel 32×32 patches for the vinculin channel.
#
# Channel layout confirmed:
#   ch0 = vinculin  (rb647)  ← this config
#   ch1 = paxillin  (m568)   ← existing cio_rb patches in pax_ch_patch/cio_rb/vinc/
#   ch2 = zyxin     (eGFP488)
#   ch3 = actin     (phalloidin405)
# =============================================================================

paths:
  root_folder      : "/net/projects/CLS/lding/data/fa_data_analysis"
  image_folder     : root_folder + "/fa_data/031125data/Control"
  cell_mask_folder : root_folder + "/fa_cellseg/031125analysis/control/code_org_20250820_seg/mask"
  patch_output_dir : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc_ch0/control/tiff_patches32"
  plot_output_dir  : root_folder + "/ae_results/pax_ch_patch/cio_rb/vinc_ch0/control/plot_patches32"

experiment:
  condition : "control"
  major_ch  : 0      # vinculin (rb647)

input:
  file_type : "czi"
  start_ind : 0
  end_ind   : 999

patch:
  patch_size   : 32
  mask_ratio   : 0.4
  pad_size     : 64
  patch_prefix : "control"

preprocessing:
  rolling_ball_radius : 20

normalization:
  norm_mode : "cell_insideoutside"

segmentation:
  seg_ch                  : 0    # segment on vinculin channel
  seg_threshold           : 0.1
  seg_close_size          : 11
  seg_min_size_initial    : 3
  seg_min_size_post_close : 10
  seg_min_size_final      : 30000

augmentation:
  rand_trans    : false
  max_shift_px  : 0
  rand_rota     : false
  max_angle_deg : 0.0

misc:
  dpi           : 256
  debug         : false
  log_level     : "INFO"
  use_timestamp : false
